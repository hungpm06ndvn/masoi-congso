<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#141842">
<title>Ma Sói Công Sở</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='%23f5c451'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--tx:#eef0ff;--mut:#a3a9d6;--acc:#f5c451;--red:#ff5d6c;--grn:#3ddc97;--glass:rgba(255,255,255,.06);--gline:rgba(255,255,255,.12);--felt1:#1f2a5c;--felt2:#11173a}
body.day{--tx:#2b1d0e;--mut:#8a6f4d;--glass:rgba(255,255,255,.72);--gline:rgba(120,80,20,.12);--felt1:#f7d9a3;--felt2:#e9b86a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#06081a;color:var(--tx);font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:color .6s}
body.day{background:#fff3df}
html:has(body.day){background:#fff3df}
html{background:#06081a}
#dayb{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 50% at 50% -5%,#fff1b8 0%,#ffd28a 35%,rgba(255,232,196,0) 70%),linear-gradient(180deg,#ffcf8a 0%,#ffe8c4 40%,#fff6e8 100%);opacity:0;transition:opacity .8s}
body.day #dayb{opacity:1}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,#2c3275 0%,#141842 45%,#06081a 100%);transition:opacity .8s}
body.day #sky{opacity:0}
#sky i{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite alternate}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:18px 16px 28px}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(180deg,#fff7d6,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #f5c45133}
.ttl{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.mut{color:var(--mut);font-size:14px;margin:0;line-height:1.45}
.sm{font-size:12px}
.center{text-align:center}
.card{background:var(--glass);border:1px solid var(--gline);border-radius:22px;padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.day .card{box-shadow:0 10px 30px rgba(150,90,20,.12)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;border:0;font:inherit;font-weight:800;font-size:16px;letter-spacing:.2px;background:linear-gradient(180deg,#ffdc78,#f0a91c);color:#2a1b00;cursor:pointer;box-shadow:0 8px 24px rgba(240,169,28,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--glass);border:1px solid var(--gline);color:var(--tx);box-shadow:none}
.btn.red{background:linear-gradient(180deg,#ff7d89,#e2364a);color:#fff;box-shadow:0 8px 24px rgba(226,54,74,.35)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.lb{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
.lb:first-child{margin-top:0}
.in{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--gline);background:rgba(0,0,0,.2);color:var(--tx);font:inherit;font-size:16px;outline:none}
.in:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--gline);background:var(--glass);color:var(--tx);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:linear-gradient(180deg,#ffdc78,#f0a91c);border-color:transparent;color:#2a1b00}
.chip:disabled{opacity:.35}
.note{font-size:12px;color:var(--mut);text-align:center;margin:0}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--gline);font-size:13px;font-weight:700;backdrop-filter:blur(10px)}
.pill.role{border-color:var(--rc);color:var(--tx)}
.hero{width:100%;display:block;border-radius:24px;margin-bottom:-4px}
.brand{text-align:center}
.brand p{margin-top:4px}

/* avatar */
.avs{width:100%;height:100%;display:block}
.mini{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;display:inline-block;vertical-align:middle;border:2px solid rgba(255,255,255,.5)}

/* table */
.tbl{position:relative;width:100%;max-width:372px;aspect-ratio:1;margin:0 auto}
.felt{position:absolute;inset:17%;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--felt1),var(--felt2));box-shadow:0 0 0 6px rgba(255,255,255,.06),0 0 0 14px rgba(0,0,0,.15),0 20px 50px rgba(0,0,0,.4),inset 0 0 40px rgba(0,0,0,.35)}
body.day .felt{box-shadow:0 0 0 6px rgba(255,255,255,.6),0 0 0 14px rgba(160,100,30,.15),0 20px 40px rgba(160,100,30,.25),inset 0 0 40px rgba(160,90,20,.25)}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;display:grid;place-items:center;text-align:center}
.mid svg{position:absolute;inset:0;width:100%;height:100%}
.trk{fill:none;stroke:rgba(255,255,255,.12);stroke-width:7}
body.day .trk{stroke:rgba(120,70,10,.15)}
.prog{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s;filter:drop-shadow(0 0 6px rgba(245,196,81,.6))}
.cin{position:relative;line-height:1.1}
.cin b{display:block;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums}
.cin small{font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tbl.hot .prog{stroke:var(--red);filter:drop-shadow(0 0 8px rgba(255,93,108,.8))}
.tbl.hot .cin b{color:var(--red);animation:pulse .5s infinite alternate}
.code{font-size:28px;font-weight:900;letter-spacing:3px;color:var(--acc)}
.seat{position:absolute;width:70px;transform:translate(-50%,-50%);text-align:center;cursor:default;transition:transform .15s}
.seat.can{cursor:pointer}
.seat.can:active{transform:translate(-50%,-50%) scale(.93)}
.sav{position:relative;width:56px;height:56px;margin:0 auto;border-radius:50%;overflow:visible}
.sav .ring{width:56px;height:56px;border-radius:50%;overflow:hidden;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 14px rgba(0,0,0,.35);background:#333;transition:box-shadow .2s,border-color .2s}
.seat.can .ring{border-color:#fff}
.seat.dis .ring{opacity:.55}
.seat.sel .ring{border-color:var(--acc);box-shadow:0 0 0 4px rgba(245,196,81,.45),0 0 22px rgba(245,196,81,.8)}
.seat.me .ring{border-color:#9ec5ff}
.seat.dead .ring{filter:grayscale(1) brightness(.6)}
.seat.new{animation:pop .35s}
.seat.empty .ring{background:transparent;border:2px dashed var(--gline);box-shadow:none}
.snm{margin-top:5px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.4)}
body.day .snm{text-shadow:none}
.snm small{font-weight:500;color:var(--mut)}
.bdg{position:absolute;right:-6px;bottom:-4px;min-width:24px;height:24px;padding:0 4px;border-radius:12px;display:grid;place-items:center;font-size:14px;background:#1b2148;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.bdg.wolf{background:#5a1220}
.bdg.vil{background:#0f4a33}
.x{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-14deg);font-size:10px;font-weight:900;letter-spacing:1px;color:#fff;background:var(--red);padding:2px 6px;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* role card */
.rc{position:relative;height:360px;perspective:1200px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;cursor:pointer}
.rc>div{position:absolute;inset:0;border-radius:26px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .45s cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.back{background:radial-gradient(circle at 50% 38%,#2d3580 0%,#151a45 55%,#0b0e28 100%);border:2px solid rgba(245,196,81,.55);box-shadow:inset 0 0 0 8px rgba(0,0,0,.25),inset 0 0 0 10px rgba(245,196,81,.25),0 20px 40px rgba(0,0,0,.45)}
.back:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 10px,transparent 10px 20px)}
.back .bm{position:relative;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7d6,#f5c451);box-shadow:0 0 50px rgba(245,196,81,.6)}
.back .bt{position:relative;margin-top:22px;font-size:13px;font-weight:800;letter-spacing:4px;color:#f5c451}
.back .bs{position:relative;margin-top:6px;font-size:12px;color:#a3a9d6;animation:pulse 1s infinite alternate}
.front{transform:rotateY(180deg);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 45%,#151a45) 0%,#12163a 70%);border:2px solid var(--rc);box-shadow:inset 0 0 0 8px rgba(0,0,0,.2),0 0 40px color-mix(in srgb,var(--rc) 50%,transparent)}
.rc.open .back{transform:rotateY(180deg)}
.rc.open .front{transform:rotateY(360deg)}
.emb{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:66px;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,.02));border:2px solid rgba(255,255,255,.25);box-shadow:0 0 30px color-mix(in srgb,var(--rc) 70%,transparent)}
.rn{font-size:30px;font-weight:900;margin:14px 0 2px;color:#fff}
.rt{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.rt.wolf{background:#ff5d6c33;color:#ff9aa4}.rt.vil{background:#3ddc9733;color:#8af0c4}
.front p{margin:4px 0;font-size:14px;color:#c9cdf0;line-height:1.5}
.front .mate{color:#ff9aa4;margin-top:10px}

/* result/death */
.res{padding:14px;border-radius:16px;text-align:center;font-weight:800;font-size:17px;animation:pop .35s}
.res.bad{background:#ff5d6c22;color:var(--red);border:1px solid #ff5d6c55}
.res.good{background:#3ddc9722;color:var(--grn);border:1px solid #3ddc9755}
.death{text-align:center;padding:26px 18px}
.dav{position:relative;width:110px;height:110px;margin:0 auto 12px}
.dav .ring{width:110px;height:110px;border-radius:50%;overflow:hidden;border:4px solid rgba(255,255,255,.9);filter:grayscale(1);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.stamp{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) rotate(-14deg);font-weight:900;font-size:18px;letter-spacing:2px;color:var(--red);border:3px solid var(--red);padding:2px 10px;border-radius:8px;background:rgba(255,255,255,.85);animation:stamp .4s .3s both}
.dn{font-size:24px;font-weight:900;margin:4px 0}
.team{display:inline-flex;align-items:center;gap:8px;margin:14px 0 8px;padding:12px 20px;border-radius:16px;font-weight:900;font-size:17px;letter-spacing:.5px;animation:pop .4s .6s both}
.team.wolf{background:linear-gradient(180deg,#ff7d89,#c92a3d);color:#fff;box-shadow:0 8px 24px rgba(201,42,61,.4)}
.team.vil{background:linear-gradient(180deg,#5fe8ad,#1fa36c);color:#fff;box-shadow:0 8px 24px rgba(31,163,108,.4)}
.peace{font-size:64px;margin:6px 0}

/* feed */
.feed{display:flex;flex-direction:column;gap:10px;max-height:230px;overflow:auto;padding:14px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg:last-child{animation:pop .3s}
.bub{background:rgba(255,255,255,.1);border:1px solid var(--gline);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:14px;line-height:1.4}
body.day .bub{background:#fff}
.bub .bn{font-size:12px;font-weight:700;color:var(--mut);display:block}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{border-radius:16px 16px 4px 16px;background:linear-gradient(180deg,#ffdc78,#f0a91c);color:#2a1b00;border:0}
.msg.me .bub .bn{color:#6b4a00}

/* vote */
.vrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--gline);font-size:14px;opacity:0;animation:fade .3s forwards}
.vrow:last-child{border-bottom:0}
.vrow .arr{color:var(--mut);margin:0 2px}
.vrow .sp{flex:1}
.reveal{opacity:0;animation:fade .45s forwards}
.tbar{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;margin-top:8px;font-size:14px;font-weight:700}
.tbar .bb{height:12px;border-radius:9px;background:var(--gline);overflow:hidden}
.tbar .bb i{display:block;height:100%;background:linear-gradient(90deg,#ff7d89,#e2364a);border-radius:9px;transform-origin:left;animation:grow .6s both}

/* intro overlay */
.intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fade .4s both;padding:20px}
.intro.night{background:radial-gradient(circle at 50% 40%,#2c3275,#06081a 70%);color:#fff}
.intro.day{background:radial-gradient(circle at 50% 40%,#fff1b8,#ffb85c 70%);color:#3a2408}
.intro .ii{font-size:96px;animation:rise 1.2s cubic-bezier(.2,.9,.3,1) both;filter:drop-shadow(0 0 30px rgba(255,220,120,.7))}
.intro h2{margin:12px 0 4px;font-size:30px;font-weight:900;animation:fade .6s .3s both}
.intro p{margin:0;opacity:.75;animation:fade .6s .5s both}
.intro.out{animation:fadeout .4s forwards}

/* end + profile */
.big2{font-size:26px;font-weight:900;margin:2px 0}
.pts{font-size:22px;font-weight:900;color:var(--acc);margin:4px 0}
.win{font-size:72px;text-align:center;filter:drop-shadow(0 0 30px rgba(245,196,81,.6));animation:rise 1s both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .card{text-align:center;padding:14px 6px}
.stats b{display:block;font-size:24px;font-weight:900}
.stats span{font-size:11px;color:var(--mut)}
.rb{display:grid;grid-template-columns:112px 1fr 36px;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.rbar{height:8px;background:var(--gline);border-radius:9px;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:9px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bd{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--gline)}
.bd span{font-size:28px;display:block}
.bd small{font-size:11px;font-weight:600}
.bd.off{opacity:.28;filter:grayscale(1)}
.lbr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--gline);font-size:14px;align-items:center}
.lbr:last-child{border-bottom:0}
.tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--gline);color:var(--mut);margin-left:6px;vertical-align:middle}
.gw{color:var(--grn)}.gl{color:var(--red)}
.ph{display:flex;align-items:center;gap:14px}
.ph .ring{width:64px;height:64px;border-radius:50%;overflow:hidden;border:3px solid #fff;flex:none}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.seat.new{animation:seatpop .35s}
@keyframes seatpop{from{transform:translate(-50%,-50%) scale(.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pulse{to{transform:scale(1.1)}}
@keyframes tw{from{opacity:.15}to{opacity:1}}
@keyframes rise{from{transform:translateY(40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
@keyframes grow{from{transform:scaleX(0)}}

/* v3 additions */
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
#sky .b1{width:340px;height:340px;left:-120px;top:-60px;background:#5b3cc4}
#sky .b2{width:300px;height:300px;right:-120px;top:240px;background:#0f8f9a;animation-delay:-6s}
#sky .b3{width:260px;height:260px;left:10%;bottom:-120px;background:#b0306a;opacity:.35;animation-delay:-11s}
#dayb .b1{width:320px;height:320px;right:-100px;top:-80px;background:#ffb347;opacity:.5}
#dayb .b2{width:300px;height:300px;left:-140px;top:380px;background:#ff8fa3;opacity:.3}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.art{display:block;width:100%;height:auto}
#stars{position:absolute;inset:0}
.bdg{padding:0;overflow:hidden;width:26px;height:26px;min-width:0;background:none}
.bdg svg{width:100%;height:100%;display:block}
.chip{display:inline-flex;align-items:center;gap:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px}
.cast{display:flex;justify-content:center;gap:10px;margin:2px 0 0}
.cast .ci{width:66px;text-align:center;font-size:11px;font-weight:700;color:var(--mut)}
.cast .ci .art{width:62px;height:62px;margin:0 auto 6px;border-radius:50%;box-shadow:0 10px 24px rgba(0,0,0,.4);animation:float 4s ease-in-out infinite}
.cast .ci:nth-child(2) .art{animation-delay:-1s}.cast .ci:nth-child(3) .art{animation-delay:-2s}.cast .ci:nth-child(4) .art{animation-delay:-3s}
@keyframes float{50%{transform:translateY(-6px)}}
.emb{width:170px;height:170px;background:none;border:0;box-shadow:none;font-size:0}
.emb .art{width:170px;height:170px;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.15),0 0 50px color-mix(in srgb,var(--rc) 70%,transparent)}
.intro .ii{font-size:0}
.intro .ii .art{width:150px;height:150px}
.team{gap:10px}
.team svg{border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.peace{display:flex;justify-content:center}
.peace .art{width:96px;height:96px;border-radius:50%}
.win{display:flex;justify-content:center;font-size:0}
.win .art{width:130px;height:130px}
.chat{padding:0;overflow:hidden}
.chat .feed{max-height:220px;min-height:90px}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--gline);background:rgba(0,0,0,.08)}
.chatin input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--gline);background:rgba(255,255,255,.08);color:var(--tx);font:inherit;font-size:15px;outline:none}
body.day .chatin input{background:#fff}
.chatin input:focus{border-color:var(--acc)}
.chatin button{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(180deg,#ffdc78,#f0a91c);color:#2a1b00;display:grid;place-items:center;cursor:pointer;flex:none}
.chatin button .ic{width:20px;height:20px}
.typing{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mut)}
.dots{display:inline-flex;gap:3px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--gline)}
body.day .dots{background:#fff}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-4px);opacity:.4}}
.wchat .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;font-weight:800;color:#ff9aa4;border-bottom:1px solid var(--gline)}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px}
.bd .md{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.3)}
.bd .md .ic{width:22px;height:22px}
.rb span:first-child{display:flex;align-items:center;gap:8px}
.rb .art{width:26px;height:26px;border-radius:50%}
.pill .art{width:18px;height:18px;border-radius:50%}

.bdg.l{left:-6px;right:auto}
.wp{display:flex;flex-direction:column;gap:12px}
.wrow{display:flex;gap:12px;align-items:center;font-size:14px}
.wrow>.art{width:40px;height:40px;flex:none;border-radius:50%}
.res.love{background:#ff4f8b22;color:#ff8fb8;border:1px solid #ff4f8b55}

  let hair='';
  if(style===0)hair=`<path d="M19 28 Q18 11 32 11 Q46 11 45 28 Q42 19 32 19 Q23 19 19 28Z" fill="${hr}"/>`;

  if(style===2)hair=`<circle cx="32" cy="9" r="6" fill="${hr}"/><path d="M19 27 Q19 13 32 13 Q45 13 45 27 Q41 18 32 18 Q23 18 19 27Z" fill="${hr}"/>`;

  <rect x="27" y="36" width="10" height="10" rx="3" fill="${sk}"/><ellipse cx="32" cy="28" rx="12" ry="13" fill="${sk}"/>${hair}

}
const mini=p=>`<span class="mini">${avatar(p)}</span>`;


function hero(){
  let b='',w='';const bs=[[0,120,46,80],[42,95,38,105],[76,130,52,70],[124,80,44,120],[164,110,40,90],[200,70,50,130],[246,118,38,82],[280,92,46,108],[322,125,40,75]];
  bs.forEach(([x,y,wd,h],k)=>{b+=`<rect x="${x}" y="${y}" width="${wd}" height="${h}" fill="${k%2?'#161b44':'#1c2252'}"/>`;

  <rect width="360" height="200" fill="url(#hs)"/><circle cx="270" cy="58" r="80" fill="url(#hg)"/><circle cx="270" cy="58" r="30" fill="url(#hm)"/><circle cx="262" cy="50" r="4" fill="#e8b64a" opacity=".5"/><circle cx="278" cy="66" r="6" fill="#e8b64a" opacity=".4"/>
  ${b}${w}<rect x="210" y="98" width="30" height="22" rx="2" fill="#0b0d22"/><path d="M214 104 l4-6 4 6 M228 104 l4-6 4 6" fill="#0b0d22" stroke="#0b0d22"/><circle cx="219" cy="110" r="2.3" fill="#ff4d5e"/><circle cx="231" cy="110" r="2.3" fill="#ff4d5e"/><circle cx="219" cy="110" r="5" fill="#ff4d5e" opacity=".25"/><circle cx="231" cy="110" r="5" fill="#ff4d5e" opacity=".25"/></svg>`;
}

/* ================= Ma Sói Công Sở — client nhiều người chơi ================= */
const socket = io();
let ST = null, OFF = 0, KEY = '', VIEW = 'home', SEL = [], SAVE = false, ERR = '', LASTSEC = -1;
const FEEDSIG = {};
let CFG = Object.assign({ name: '' }, st.get('msc_cfg', {}));
const TOKEN = (() => { let t = st.get('msc_token', null); if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36); st.set('msc_token', t); } return t; })();
const URLROOM = (new URLSearchParams(location.search).get('room') || '').replace(/\D/g, '').slice(0, 4);

const P = id => ST.players.find(p => p.id === id);
const ME = () => ST.me;
const isMe = p => p.id === ST.me.id;
const isHost = () => ST && ST.hostId === ST.me.id;
const alive = () => ST.players.filter(p => p.alive);
const left = () => ST && ST.endsAt ? Math.max(0, Math.ceil((ST.endsAt - (Date.now() + OFF)) / 1000)) : 0;
const CAUSE = { wolf: 'đã bị Sói tấn công đêm qua', poison: 'đã trúng bình độc của Phù thủy', love: 'chết theo người yêu vì quá đau lòng', vote: 'bị cả bàn biểu quyết loại', shot: 'trúng phát súng của Thợ săn' };

/* ---------- socket ---------- */
socket.on('connect', () => {
  conn(true);
  const code = st.get('msc_room', null);
  if (code) socket.emit('join', { code, name: CFG.name, token: TOKEN }, r => { if (!r.ok) { st.set('msc_room', null); ST = null; if (VIEW === 'game') home(); } });
});
socket.on('disconnect', () => conn(false));
socket.on('state', s => {
  OFF = s.now - Date.now(); const prev = ST; ST = s; st.set('msc_room', s.code);
  if (VIEW === 'replay' && s.phase === 'end') return;
  if (VIEW === 'profile') return;
  VIEW = 'game'; render(prev);
});
socket.on('react', r => throwReact(r.from, r.to, r.k));
function conn(ok) { let b = $('conn'); if (!b) { b = document.createElement('div'); b.id = 'conn'; document.body.appendChild(b); } b.className = ok ? '' : 'on'; b.innerHTML = ok ? '' : `${ic('alert')} Mất kết nối, đang thử lại…`; }

/* ---------- timer loop ---------- */
const CR = 2 * Math.PI * 52;
setInterval(() => {
  if (!ST || VIEW !== 'game') return;
  const L = left(), T = ST.total || 1;
  const n = $('tnum'), r = $('tring'), t = $('tbl'), pb = $('pbar'), ts = $('tsec');
  if (n) n.textContent = L;
  if (r) r.style.strokeDashoffset = CR * (1 - L / T);
  if (t) t.classList.toggle('hot', ST.endsAt && L <= 5);
  if (pb) { pb.style.width = (100 * L / T) + '%'; pb.classList.toggle('hot', L <= 5); }
  if (ts) ts.textContent = ST.endsAt ? L + 's' : '';
  if (ST.endsAt && L !== LASTSEC) { if (L <= 5 && L > 0 && ['night', 'witch', 'day', 'vote', 'hunter'].includes(ST.phase)) vib(25); LASTSEC = L; }
}, 250);

/* ---------- home ---------- */
function home() {
  VIEW = 'home'; clearAll(); setMode('night');
  view(`${hero()}
  <div class="brand"><h1>Ma Sói Công Sở</h1><p class="mut">Ngồi chơi cùng bàn · Mỗi người một điện thoại · 10 phút giờ trưa</p></div>
  <div class="cast">${['wolf', 'seer', 'witch', 'hunter', 'cupid'].map(k => `<div class="ci">${art(k)}${ROLES[k].n}</div>`).join('')}</div>
  <div class="card">
    <label class="lb">Tên của bạn</label><input id="nm" class="in" maxlength="14" placeholder="VD: Hưng" value="${esc(CFG.name)}">
    ${URLROOM ? `<label class="lb">Mã phòng</label><input id="rc_in" class="in code-in" inputmode="numeric" maxlength="4" value="${URLROOM}">
      <button class="btn" style="margin-top:14px" onclick="joinRoom()">${ic('users', 18)} Vào phòng ${URLROOM}</button>`
      : `<button class="btn" style="margin-top:16px" onclick="createRoom()">${ic('home', 18)} Tạo phòng mới</button>
      <div class="or"><span>hoặc vào phòng có sẵn</span></div>
      <div class="joinrow"><input id="rc_in" class="in code-in" inputmode="numeric" maxlength="4" placeholder="Mã 4 số"><button class="btn sec" onclick="joinRoom()">Vào phòng</button></div>`}
    ${ERR ? `<p class="err">${esc(ERR)}</p>` : ''}
  </div>
  <button class="btn sec" onclick="profile()">${ic('user', 18)} Hồ sơ của tôi</button>
  <p class="note">Thiếu người? Chủ phòng bấm bắt đầu, hệ thống tự thêm bot cho đủ bàn.</p>`);
}
function saveName() { const el = $('nm'); CFG.name = (el ? el.value : CFG.name).trim().slice(0, 14); st.set('msc_cfg', CFG); return CFG.name; }
function createRoom() {
  if (!saveName()) { ERR = 'Nhập tên của bạn trước nhé.'; return home(); }
  socket.emit('create', { name: CFG.name, token: TOKEN }, r => { if (!r.ok) { ERR = r.err; home(); } else { ERR = ''; history.replaceState(null, '', '/'); } });
}
function joinRoom() {
  if (!saveName()) { ERR = 'Nhập tên của bạn trước nhé.'; return home(); }
  const code = ($('rc_in').value || '').trim();
  if (!/^\d{4}$/.test(code)) { ERR = 'Mã phòng gồm 4 chữ số.'; return home(); }
  socket.emit('join', { code, name: CFG.name, token: TOKEN }, r => { if (!r.ok) { ERR = r.err; home(); } else { ERR = ''; history.replaceState(null, '', '/'); } });
}
function leaveRoom() { socket.emit('leave'); st.set('msc_room', null); ST = null; KEY = ''; home(); }

/* ---------- table ---------- */
function badges(p, o) {
  let b = '', l = '';
  if (p.role) b = art(p.role);

  else if (p.known !== undefined) b = p.known ? teamMark('wolf') : okMark();
  if (p.lover) l = heartMark();
  else if (o.voted && p.voted) l = okMark();
  return (b ? `<span class="bdg">${b}</span>` : '') + (l ? `<span class="bdg l">${l}</span>` : '');
}
function seat(p, o, i, n) {
  const a = Math.PI / 2 + 2 * Math.PI * i / n, x = 50 + 41 * Math.cos(a), y = 50 + 41 * Math.sin(a);
  if (!p) return `<div class="seat empty" style="left:${x}%;top:${y}%"><div class="sav"><div class="ring"></div></div><div class="snm"><small>${o.emptyLabel || 'Trống'}</small></div></div>`;
  const can = !!o.can && o.can(p);
  const cls = ['seat', isMe(p) ? 'me' : '', p.alive === false ? 'dead' : '', (o.sel || []).includes(p.id) ? 'sel' : '', can ? 'can' : '', o.on && !can ? 'dis' : '', (o.wsel || []).includes(p.id) ? 'wsel' : '', p.connected === false ? 'off' : ''].join(' ');
  return `<div class="${cls}" style="left:${x}%;top:${y}%" ${can ? `onclick="${o.on}(${p.id})"` : ''}>
    <div class="sav"><div class="ring">${avatar(p)}</div>${badges(p, o)}${p.alive === false ? '<span class="x">LOẠI</span>' : ''}</div>
    <div class="snm">${esc(p.name)}${isMe(p) ? ' <small>(bạn)</small>' : p.isBot ? ' <small>bot</small>' : ''}${p.id === ST.hostId && ST.phase === 'lobby' ? ' <small>· chủ</small>' : ''}</div></div>`;
}
function table(o, mid) {
  const ps = ST.players, n = Math.max(o.n || ps.length, ps.length); let s = '';
  for (let i = 0; i < n; i++) s += seat(ps[i], o, i, n);
  return `<div class="tbl" id="tbl"><div class="felt"></div><div class="mid">${mid}</div>${s}</div>`;
}
function timerMid(label) {
  const L = left(), T = ST.total || 1;
  return `<svg viewBox="0 0 118 118"><circle class="trk" cx="59" cy="59" r="52"/><circle id="tring" class="prog" cx="59" cy="59" r="52" stroke-dasharray="${CR}" style="stroke-dashoffset:${CR * (1 - L / T)}" transform="rotate(-90 59 59)"/></svg><div class="cin"><small>${label}</small><b id="tnum">${L}</b><small>giây</small></div>`;
}
const pbar = () => `<div class="pbarw"><i id="pbar" style="width:${100 * left() / (ST.total || 1)}%"></i></div>`;
function seatXY(id) { const i = ST.players.findIndex(p => p.id === id), n = ST.players.length, a = Math.PI / 2 + 2 * Math.PI * i / n; return [50 + 41 * Math.cos(a), 50 + 41 * Math.sin(a)]; }
function throwReact(from, to, k) {
  const t = $('tbl'); if (!t || !ST || !P(from)) return;
  const [x1, y1] = seatXY(from), [x2, y2] = to == null || !P(to) ? [50, 50] : seatXY(to);
  const el = document.createElement('div'); el.className = 'fly'; el.innerHTML = sticker(k); el.style.left = x1 + '%'; el.style.top = y1 + '%'; t.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.left = x2 + '%'; el.style.top = y2 + '%'; el.classList.add('go'); }));
  setTimeout(() => el.classList.add('hit'), 650); setTimeout(() => el.remove(), 1700);
}
function hdr(icon, phase) {
  const me = ME(), r = me.role ? ROLES[me.role] : null;
  return `<div class="hdr"><span class="pill">${ic(icon)} ${phase} <b id="tsec" class="tsec"></b></span>${r ? `<span class="pill role" style="--rc:${r.c}">${me.alive ? art(me.role) + ' ' + r.n : ic('ghost') + ' Đã bị loại'}</span>` : ''}</div>`;
}
function introFx(mode, kind, title, sub) {
  document.querySelectorAll('.intro').forEach(e => e.remove());
  const o = document.createElement('div'); o.className = 'intro ' + mode; o.innerHTML = `<div class="ii">${art(kind)}</div><h2>${title}</h2><p>${sub}</p>`;
  document.body.appendChild(o); vib(40);
  setTimeout(() => { o.classList.add('out'); setTimeout(() => o.remove(), 380); }, 1500);
}
function clearAll() { document.querySelectorAll('.intro').forEach(e => e.remove()); }

/* ---------- chat ---------- */
function chatBox(ch, ph) { return `<div id="feed_${ch}" class="feed"></div><form class="chatin" onsubmit="sendChat(event,'${ch}')"><input id="ci_${ch}" autocomplete="off" maxlength="160" placeholder="${ph}"><button type="submit" aria-label="Gửi">${ic('send')}</button></form>`; }
function updFeed(ch) {
  const f = $('feed_' + ch); if (!f) return;
  const list = ch === 'wolf' ? ST.wfeed : ch === 'ghost' ? ST.gfeed : ST.feed, typ = ch === 'day' ? ST.typing : null;
  const sig = list.length + '|' + typ; if (FEEDSIG[ch] === sig && f.childElementCount) return; FEEDSIG[ch] = sig;
  f.innerHTML = (list.length ? list.map(m => { const p = P(m.id) || { id: m.id, name: '?', color: '#999' }; return `<div class="msg ${isMe(p) ? 'me' : ''}">${mini(p)}<div class="bub"><span class="bn">${esc(p.name)}</span>${m.msg}</div></div>`; }).join('')
    : `<p class="mut center">${ch === 'wolf' ? 'Kênh bí mật, chỉ phe Sói thấy được.' : ch === 'ghost' ? 'Chỉ những người đã bị loại thấy kênh này.' : 'Chưa ai lên tiếng. Gõ gì đó để mở màn!'}</p>`)
    + (typ != null && P(typ) ? `<div class="typing">${mini(P(typ))}<span class="dots"><i></i><i></i><i></i></span>${esc(P(typ).name)} đang gõ…</div>` : '');
  f.scrollTop = f.scrollHeight;
}
function sendChat(e, ch) { e.preventDefault(); const i = $('ci_' + ch); const t = (i.value || '').trim(); if (!t) return; i.value = ''; socket.emit('chat', { ch, text: t }); }
function betHTML() {
  const b = ME().bet; return b ? `<p class="mut sm" style="margin:0">Bạn đã cược <b>${TEAM[b].n}</b> thắng · đúng được +40 điểm</p>`
    : `<p class="mut sm" style="margin:0 0 8px">Cược phe thắng chung cuộc (đúng được +40 điểm):</p><div class="chips"><button class="chip" onclick="socket.emit('bet',{team:'wolf'})">${teamMark('wolf', 18)} Phe Sói</button><button class="chip" onclick="socket.emit('bet',{team:'vil'})">${teamMark('vil', 18)} Phe Dân</button></div>`;
}
function distHTML() {
  const d = ST.dist || {}, order = ['wolf', 'seer', 'guard', 'witch', 'hunter', 'cupid', 'vil'], total = Object.values(d).reduce((a, b) => a + b, 0);
  return `<div class="card dist"><div class="dh"><b>Cơ cấu vai · ${total} người</b><span class="dw">${teamMark('wolf', 18)} ${d.wolf || 0} Sói vs ${teamMark('vil', 18)} ${total - (d.wolf || 0)} Dân</span></div>
  <div class="dg">${order.filter(k => d[k]).map(k => `<div class="di ${ROLES[k].team}"><div class="da">${art(k)}<span class="dn2">${d[k]}</span></div><small>${ROLES[k].n}</small></div>`).join('')}</div></div>`;
}
const ghostCard = () => `<div class="card chat gchat"><div class="hd">${ic('ghost')} Khu khán giả · chỉ người đã bị loại thấy</div><div class="betw" id="betw">${betHTML()}</div>${chatBox('ghost', 'Bình luận cùng những người đã bị loại…')}</div>`;

/* ---------- render dispatcher ---------- */
function render(prev) {
  const me = ME();
  const key = [ST.code, ST.phase, ST.round, ST.gameNo, me.kind, me.alive, ST.phase === 'deaths' ? (ST.deaths || []).map(d => d.id).join(',') + ST.dtitle : '', ST.hunterId ?? ''].join('|');
  if (prev && prev.code === ST.code && prev.phase !== ST.phase) {
    if (ST.phase === 'night') introFx('night', 'moon', `Đêm ${ST.round}`, 'Màn đêm buông xuống… mọi người cúi xuống điện thoại');
    if (ST.phase === 'deaths' && ['night', 'witch'].includes(prev.phase)) introFx('day', 'sun', `Sáng ngày ${ST.round}`, 'Mọi người ngẩng đầu lên…');
  }
  const fresh = key !== KEY;
  if (fresh) { KEY = key; SEL = []; SAVE = false; Object.keys(FEEDSIG).forEach(k => delete FEEDSIG[k]); }
  const R = SCREENS[ST.phase]; if (!R) return;
  if (fresh || !R.part) R.full(); else R.part();
  const A = $('act'); if (A) A.classList.toggle('dock', !document.querySelector('.chatin'));
  if (ST.phase === 'end') saveProfile();
}
const SCREENS = {};

/* ----- lobby ----- */
SCREENS.lobby = { full() {
  setMode('night');
  const hs = ST.players.length, seats = Math.max(ST.settings.seats, hs), bots = seats - hs, host = isHost();
  const link = `${location.origin}/?room=${ST.code}`;
  view(`<div class="hdr"><span class="pill">${ic('home')} Phòng ${ST.code}</span><span class="pill">${ic('users')} ${hs} người${bots ? ` + ${bots} bot` : ''}</span></div>
  <div class="card center"><img class="qrimg" src="/qr/${ST.code}.svg" alt="Mã QR vào phòng"><p class="mut">Quét mã QR hoặc nhập mã <b style="color:var(--acc)">${ST.code}</b></p>
    <div class="linkrow"><span>${esc(link)}</span><button class="chip" onclick="copyLink('${link}')">${ic('cards')} Sao chép</button></div></div>
  ${table({ n: seats, emptyLabel: 'Bot' }, `<div class="cin"><small>Mã phòng</small><div class="code">${ST.code}</div><small>${hs}/${seats}</small></div>`)}
  ${distHTML()}
  ${host ? `<div class="card"><label class="lb">Số ghế (thiếu người tự thêm bot)</label><div class="chips">${[6, 7, 8, 9, 10, 11, 12].filter(n => n >= Math.min(12, hs)).map(n => `<button class="chip ${ST.settings.seats == n ? 'on' : ''}" onclick="socket.emit('settings',{seats:${n}})">${n}</button>`).join('')}</div>
    <label class="lb">Nhịp chơi</label><div class="chips"><button class="chip ${ST.settings.speed === 'real' ? 'on' : ''}" onclick="socket.emit('settings',{speed:'real'})">${ic('clock')} Chuẩn (~10 phút)</button><button class="chip ${ST.settings.speed === 'demo' ? 'on' : ''}" onclick="socket.emit('settings',{speed:'demo'})">${ic('bolt')} Nhanh</button></div></div>
    <button class="btn" onclick="socket.emit('start')">${ic('cards', 18)} Chia vai & bắt đầu${bots ? ` (thêm ${bots} bot)` : ''}</button>`
    : `<div class="card center"><p class="mut">Chờ chủ phòng <b>${esc(P(ST.hostId)?.name || '')}</b> bắt đầu ván…</p></div>`}
  <button class="btn sec" onclick="leaveRoom()">Rời phòng</button>`);
} };
function copyLink(l) { try { navigator.clipboard.writeText(l).then(() => toast('Đã sao chép link phòng')); } catch (e) { toast(l); } }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2000); }

/* ----- reveal ----- */
SCREENS.reveal = {
  full() {
    setMode('night'); const me = ME(), r = ROLES[me.role];
    const mates = me.role === 'wolf' ? ST.players.filter(p => p.role === 'wolf' && !isMe(p)).map(p => p.name).join(', ') : '';
    view(`<div class="hdr"><span class="pill">${ic('cards')} Chia vai <b id="tsec" class="tsec"></b></span><span class="pill">${ic('lock')} Bí mật</span></div>${pbar()}
    <div><h2 class="ttl">Vai bí mật của bạn</h2><p class="mut">Che màn hình, giữ thẻ để xem. Thả tay ra, thẻ tự úp lại.</p></div>
    <div class="rc" id="rc" oncontextmenu="return false"><div class="back"><div class="bm"></div><div class="bt">MA SÓI CÔNG SỞ</div><div class="bs">Giữ để lật thẻ</div></div>
      <div class="front" style="--rc:${r.c}"><div class="emb">${art(me.role)}</div><div class="rn">${r.n}</div><div class="rt ${r.team}">${TEAM[r.team].n}</div><p>${r.d}</p>${mates ? `<p class="mate">Đồng bọn: <b>${esc(mates)}</b></p>` : ''}</div></div>
    ${distHTML()}<div id="act"></div>`);
    const rc = $('rc');
    rc.addEventListener('pointerdown', e => { e.preventDefault(); rc.classList.add('open'); vib(20); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => rc.addEventListener(t, () => rc.classList.remove('open')));
    this.part();
  },
  part() { const n = ST.players.filter(p => p.ready).length; set('act', `<button class="btn" ${ME().ready ? 'disabled' : ''} onclick="socket.emit('ready')">${ME().ready ? ic('check', 18) + ` Đã sẵn sàng · ${n}/${ST.players.length}` : 'Tôi đã nhớ vai'}</button>`); }
};

/* ----- night & witch ----- */
const NK = {
  wolf: ['Chọn con mồi đêm nay', 'Bàn với đồng bọn trong kênh bí mật. Viền đỏ là lựa chọn của đồng bọn.'],
  seer: ['Soi một người', 'Bạn sẽ biết người đó thuộc phe Sói hay phe Dân.'],
  guard: ['Bảo vệ một người', 'Không được bảo vệ cùng một người 2 đêm liền.'],
  cupid: ['Ghép đôi hai người', 'Chạm vào 2 người (có thể gồm cả bạn). Họ sẽ sống chết có nhau.'],
  cover: ['Bạn nghi ai nhất?', 'Vai nào cũng phải bấm ban đêm, để không ai đoán được vai qua việc ai đang dùng máy.'],
  witch: ['Phù thủy ra tay', 'Cứu người bị Sói tấn công, hoặc đầu độc một người. Không bắt buộc.'],
  wait: ['Phù thủy đang hành động…', 'Hãy tiếp tục cúi xuống điện thoại, đừng để lộ gì.'],
  ghost: ['Bạn đã bị loại', 'Hãy theo dõi trong im lặng. Bạn vẫn có thể cược phe thắng và trò chuyện ở khu khán giả.']
};
function canConfirm() { const k = ME().kind; return k === 'cupid' ? SEL.length === 2 : k === 'witch' ? true : ['wolf', 'seer', 'guard', 'cover'].includes(k) && SEL.length === 1; }
function witchPanel() {
  const w = ST.witch || {}, t = w.target != null ? P(w.target) : null, done = ME().done;
  const saveOn = done ? w.chosenSave : SAVE;
  return `<div class="card wp"><div class="wrow">${art('wolf')}<div>${t ? `Sói đang tấn công <b>${esc(t.name)}</b>${isMe(t) ? ' (chính bạn!)' : ''}` : 'Đêm nay Sói không tấn công ai'}</div></div>
  <div class="wrow">${art('witch')}<div style="flex:1">${(w.save || saveOn) && t ? `<button class="chip ${saveOn ? 'on' : ''}" ${done ? 'disabled' : ''} onclick="SAVE=!SAVE;vib(10);SCREENS.night.part()">${ic('flask')} ${saveOn ? 'Đã chọn cứu ' + esc(t.name) : 'Dùng bình cứu'}</button>` : `<span class="mut sm">${w.save ? 'Không có ai để cứu' : 'Bình cứu đã dùng'}</span>`}
  <p class="mut sm" style="margin:6px 0 0">${done ? (w.chosenPoison != null ? `Đã đầu độc <b>${esc(P(w.chosenPoison).name)}</b>.` : 'Đã xác nhận.') : w.poison ? (SEL.length ? `Sẽ đầu độc <b>${esc(P(SEL[0]).name)}</b>. Chạm lại để huỷ.` : 'Muốn đầu độc ai thì chạm vào người đó trên bàn.') : 'Bình độc đã dùng.'}</p></div></div></div>`;
}
function loveNote() { const ls = ST.players.filter(p => p.lover); return ls.length === 2 ? `<div class="res love" style="display:flex;align-items:center;justify-content:center;gap:10px">${heartMark(28)} ${esc(ls[0].name)} & ${esc(ls[1].name)} đã thành một cặp</div>` : ''; }
SCREENS.night = {
  full() {
    setMode('night'); const me = ME(), k = me.kind; let [t, h] = NK[k] || ['', ''];
    if (k === 'cover' && me.role === 'witch') h = 'Bước này chỉ để che vai. Ngay sau đây bạn sẽ được xem ai bị Sói tấn công và dùng bình cứu hoặc bình độc.';
    view(`${hdr('moon', 'Đêm ' + ST.round)}<div><h2 class="ttl">${t}</h2><p class="mut">${h}</p></div><div id="tw"></div><div id="note"></div>
    ${k === 'wolf' ? `<div class="card chat wchat"><div class="hd">${teamMark('wolf', 18)} Kênh bí mật của Sói</div>${chatBox('wolf', 'Nhắn cho đồng bọn…')}</div>` : ''}
    ${k === 'ghost' ? ghostCard() : ''}<div id="act"></div>`);
    this.part();
  },
  part() {
    const me = ME(), k = me.kind, cand = ST.cand || [];
    const sel = me.done ? me.pick : SEL;
    const wsel = k === 'wolf' ? [].concat(...ST.players.filter(p => p.wsel).map(p => p.wsel)) : [];
    set('tw', table({ sel, wsel, can: p => cand.includes(p.id) && !me.done, on: 'pickN' }, timerMid(ST.phase === 'witch' ? 'Phù thủy' : 'Đêm ' + ST.round)));
    let note = '';
    if (k === 'witch') note += witchPanel();
    if (k === 'seer' && me.note) note += `<div class="res ${/SÓI/.test(me.note) ? 'bad' : 'good'}" style="display:flex;align-items:center;justify-content:center;gap:10px">${teamMark(/SÓI/.test(me.note) ? 'wolf' : 'vil', 28)} ${me.note}</div>`;
    if (k === 'cupid' && me.done) note += loveNote();
    set('note', note);
    let label = me.done ? ic('check', 18) + ' Đã xác nhận · Chờ mọi người…' : !canConfirm() ? (k === 'cupid' ? `Chọn đủ 2 người (${SEL.length}/2)` : 'Chạm vào một người trên bàn')
      : k === 'cupid' ? `Ghép đôi ${esc(P(SEL[0]).name)} & ${esc(P(SEL[1]).name)}` : k === 'witch' ? 'Xác nhận' : 'Xác nhận chọn ' + esc(P(SEL[0]).name);
    set('act', ['ghost', 'wait'].includes(k) ? '' : `<button class="btn" ${!canConfirm() || me.done ? 'disabled' : ''} onclick="confirmN()">${label}</button>`);
    updFeed('wolf'); updFeed('ghost'); set('betw', $('betw') ? betHTML() : '');
  }
};
SCREENS.witch = SCREENS.night;
function pickN(id) {
  const me = ME(); if (me.done) return; const k = me.kind;
  if (k === 'cupid') { const i = SEL.indexOf(id); if (i >= 0) SEL.splice(i, 1); else if (SEL.length < 2) SEL.push(id); else SEL = [SEL[1], id]; }
  else if (k === 'witch') SEL = SEL[0] === id ? [] : [id];
  else SEL = [id];
  if (k === 'wolf') socket.emit('nsel', { ids: SEL });
  vib(10); SCREENS.night.part();
}
function confirmN() { if (!canConfirm()) return; socket.emit('nconfirm', { ids: SEL, save: SAVE }); }

/* ----- deaths (công bố + lời trăng trối) ----- */
function deathCard(d) {
  const p = P(d.id);
  return `<div class="card death"><div class="dav"><div class="ring">${avatar(p)}</div><span class="stamp">BỊ LOẠI</span></div>
  <div class="dn">${esc(p.name)}${isMe(p) ? ' (bạn)' : ''}</div><p class="mut">${CAUSE[d.cause]}</p>
  <div class="cont ${ST.over ? 'over' : ''}">${ST.over ? ic('trophy') + ' Trò chơi kết thúc' : ic('replay') + ' Trò chơi tiếp tục'}</div><p class="mut sm">Vai và phe của người bị loại được giữ bí mật đến hết ván</p></div>`;
}
SCREENS.deaths = {
  full() {
    setMode('day'); const D = ST.deaths || [], me = ME();
    const lovers = ST.players.filter(p => p.lover);
    const top = ST.round === 1 && ST.dctx === 'night' && lovers.length === 2 && (me.role === 'cupid' || lovers.some(isMe))
      ? `<div class="card lovec"><div style="width:54px;flex:none">${art('cupid')}</div><div>${lovers.some(isMe) ? `Cupid đã ghép đôi bạn với <b>${esc(lovers.find(p => !isMe(p))?.name || '')}</b>. Nếu một người chết, người kia chết theo.` : `Cặp đôi bạn ghép: <b>${esc(lovers[0].name)}</b> & <b>${esc(lovers[1].name)}</b>.`}</div></div>` : '';
    const icon = ST.dctx === 'vote' ? 'vote' : 'sun';
    view(`${hdr(icon, esc(ST.dtitle || ''))}${pbar()}${top}
    ${D.length ? D.map(deathCard).join('') : `<div class="card death"><div class="peace">${art('guard')}</div><div class="dn">Đêm qua bình yên</div><p class="mut">Không ai bị loại. Có vẻ ai đó đã được cứu…</p></div>`}
    <div id="act"></div>`);
    this.part();
  },
  part() {
    set('act', isHost() ? `<button class="btn" onclick="socket.emit('skip')">Tiếp tục</button>` : `<p class="mut center sm">Tự động chuyển tiếp khi hết giờ…</p>`);
  }
};

/* ----- hunter ----- */
SCREENS.hunter = {
  full() {
    setMode('day'); const mine = ST.hunterId === ME().id;
    view(`${hdr('cross', mine ? 'Thợ săn' : 'Chờ một chút')}<div class="card lovec"><div style="width:54px;flex:none">${art(mine ? 'hunter' : 'moon')}</div><div>${mine ? '<b>Bạn là Thợ săn!</b> Chọn một người để bắn trước khi gục ngã. Hết giờ mà chưa chọn thì bỏ lượt.' : 'Có người vẫn còn một hành động cuối cùng… Hãy chờ trong giây lát.'}</div></div><div id="tw"></div><div id="act"></div>`);
    this.part();
  },
  part() {
    const mine = ST.hunterId === ME().id, cand = ST.cand || [];
    set('tw', table({ sel: SEL, can: p => mine && cand.includes(p.id), on: 'pickH' }, timerMid('Ngắm bắn')));
    set('act', mine ? `<button class="btn red" ${!SEL.length ? 'disabled' : ''} onclick="socket.emit('shoot',{id:SEL[0]})">${!SEL.length ? 'Chạm vào người bạn muốn bắn' : ic('cross', 18) + ' Bắn ' + esc(P(SEL[0]).name)}</button>` : '');
  }
};
function pickH(id) { SEL = [id]; vib(10); SCREENS.hunter.part(); }

/* ----- day ----- */
SCREENS.day = {
  full() {
    setMode('day'); const me = ME();
    view(`${hdr('sun', 'Thảo luận · Ngày ' + ST.round)}
    <p class="mut">Tranh luận trực tiếp hoặc gõ chat. Chạm vào một người để nhắc tới hoặc thả cảm xúc vào họ.</p>
    <div id="tw"></div>
    ${me.alive ? `<div class="stk">${Object.keys(STK).map(k => `<button onclick="react('${k}')">${sticker(k)}<small>${STK[k]}</small></button>`).join('')}</div>` : ''}
    <div class="card chat">${me.alive ? chatBox('day', 'Nhắn cho cả bàn… (VD: Tôi nghi Lan)') : '<div id="feed_day" class="feed"></div>'}</div>
    ${me.alive ? '<div class="chips" id="qcw"></div>' : ghostCard()}
    <div id="act"></div>`);
    this.part();
  },
  part() {
    const me = ME();
    set('tw', table({ sel: SEL, can: p => p.alive && !isMe(p) && me.alive, on: 'pickD' }, timerMid('Thảo luận')));
    set('qcw', qc()); updFeed('day'); updFeed('ghost'); if ($('betw')) set('betw', betHTML());
    const hs = ST.players.filter(p => p.alive && !p.isBot && p.connected), rv = hs.filter(p => p.readyVote).length;
    set('act', (me.alive ? `<button class="btn ${me.readyVote ? 'sec' : 'red'}" onclick="socket.emit('readyVote')">${ic('vote', 18)} ${me.readyVote ? 'Đã sẵn sàng' : 'Sẵn sàng biểu quyết'} (${rv}/${hs.length})</button>` : '')
      + (isHost() ? `<button class="btn sec" style="margin-top:10px" onclick="socket.emit('skip')">Chủ phòng: biểu quyết ngay</button>` : ''));
  }
};
let QUICK = [];
function qc() {
  const s = SEL.length ? P(SEL[0]) : null;
  QUICK = ['Tôi là Dân thường.', 'Tôi là Tiên tri.', s ? `Tôi nghi ${s.name} lắm.` : '', s ? `Tôi tin ${s.name}.` : ''];
  const lab = [['Tôi là Dân', ic('hand')], ['Tôi là Tiên tri', ic('eye')], [s ? `Nghi ${esc(s.name)}` : 'Nghi… (chọn người)', ic('alert')], [s ? `Tin ${esc(s.name)}` : 'Tin… (chọn người)', ic('thumb')]];
  return lab.map(([l, i], k) => `<button class="chip" ${!QUICK[k] ? 'disabled' : ''} onclick="quick(${k})">${i}${l}</button>`).join('');
}
function quick(k) { const t = QUICK[k]; if (!t) return; socket.emit('chat', { ch: 'day', text: t }); if (SEL.length && k === 2) socket.emit('react', { to: SEL[0], k: 'nghi' }); if (SEL.length && k === 3) socket.emit('react', { to: SEL[0], k: 'tim' }); }
function pickD(id) { SEL = SEL[0] === id ? [] : [id]; vib(10); SCREENS.day.part(); }
function react(k) { socket.emit('react', { to: SEL.length ? SEL[0] : null, k }); vib(15); }

/* ----- vote ----- */
SCREENS.vote = {
  full() {
    setMode('day'); const me = ME(); if (me.vote != null) SEL = [me.vote];
    view(`${hdr('vote', 'Biểu quyết · Ngày ' + ST.round)}<div><h2 class="ttl">Bỏ phiếu kín</h2><p class="mut">Phiếu của mọi người được lật cùng lúc khi hết giờ. Dấu tích xanh: người đã bỏ phiếu.</p></div><div id="tw"></div>${!me.alive ? ghostCard() : ''}<div id="act"></div>`);
    this.part();
  },
  part() {
    const me = ME();
    set('tw', table({ sel: me.vdone ? [me.vote] : SEL, voted: true, can: p => p.alive && !isMe(p) && !me.vdone && me.alive, on: 'pickV' }, timerMid('Bỏ phiếu')));
    set('act', me.alive ? `<button class="btn red" ${!SEL.length || me.vdone ? 'disabled' : ''} onclick="socket.emit('vconfirm',{id:SEL[0]})">${me.vdone ? ic('check', 18) + ' Đã bỏ phiếu · Chờ mọi người…' : !SEL.length ? 'Chạm vào người bạn muốn loại' : ic('vote', 18) + ' Bỏ phiếu loại ' + esc(P(SEL[0]).name)}</button>` : `<p class="mut center">${ic('ghost')} Bạn đã bị loại, không được bỏ phiếu.</p>`);
    updFeed('ghost'); if ($('betw')) set('betw', betHTML());
  }
};
function pickV(id) { SEL = [id]; vib(10); socket.emit('vsel', { id }); SCREENS.vote.part(); }

/* ----- tally ----- */
SCREENS.tally = {
  full() {
    setMode('day'); const T = ST.tally, a = T.order.map(P);
    const d1 = a.length * 0.22 + 0.2, d2 = d1 + 0.8, ranked = Object.keys(T.cnt).map(Number).sort((x, y) => T.cnt[y] - T.cnt[x]);
    view(`<div class="hdr"><span class="pill">${ic('vote')} Kết quả · Ngày ${ST.round} <b id="tsec" class="tsec"></b></span><span class="pill">${Object.keys(T.votes).length} phiếu</span></div>${pbar()}
    <div class="card">${a.map((p, i) => `<div class="vrow" style="animation-delay:${i * 0.22}s">${mini(p)}<span>${esc(p.name)}</span><span class="arr">→</span><span class="sp"></span>${T.votes[p.id] != null ? `<b>${esc(P(T.votes[p.id]).name)}</b>${mini(P(T.votes[p.id]))}` : '<i class="mut">phiếu trắng</i>'}</div>`).join('')}</div>
    <div class="card reveal" style="animation-delay:${d1}s"><b>Tổng phiếu</b>${ranked.map(id => `<div class="tbar">${mini(P(id))}<div class="bb"><i style="width:${100 * T.cnt[id] / T.max}%;animation-delay:${d1}s"></i></div><span>${T.cnt[id]}</span></div>`).join('')}</div>
    <div class="card center reveal" style="animation-delay:${d2}s">${T.out != null ? `<div class="dn" style="font-size:20px">${esc(P(T.out).name)} bị loại với ${T.max} phiếu</div>${T.chain ? '<p class="mut">…và có người chết theo!</p>' : ''}` : `<div class="peace" style="color:var(--acc)">${ic('scale', 64)}</div><div class="dn">Hoà phiếu</div><p class="mut">Không ai bị loại hôm nay.</p>`}</div>
    ${isHost() ? `<button class="btn reveal" style="animation-delay:${d2}s" onclick="socket.emit('skip')">Tiếp tục</button>` : ''}`);
  }
};

/* ----- end ----- */

    <div class="card center"><p class="big2">${R.won ? 'Bạn THẮNG' : 'Bạn thua'}</p><p class="pts">+${R.pts} điểm</p>

      ${nb.length ? `<div class="badges" style="margin-top:14px">${nb.map(k => `<div class="bd"><span class="md" style="background:${BADGES[k].c}">${ic(BADGES[k].i)}</span><small>${BADGES[k].n}</small></div>`).join('')}</div>` : ''}</div>
    <button class="btn" onclick="replay()">${ic('replay', 18)} Xem lại ván đấu</button>
    <div><h2 class="ttl" style="font-size:18px">Lật bài toàn bộ</h2><p class="mut">Hết ván, mọi vai giờ mới được công khai.</p></div>
    ${table({}, `<div style="width:64px;height:64px">${art(w === 'wolf' ? 'wolf' : 'house')}</div>`)}
    ${isHost() ? `<button class="btn" onclick="socket.emit('again')">Chơi ván mới (giữ nguyên phòng)</button>` : `<div class="card center"><p class="mut">Chờ chủ phòng mở ván mới…</p></div>`}
    <button class="btn sec" onclick="leaveRoom()">Rời phòng</button>`);
  }
};
let SAVED_BADGES = [];
function newBadges() { return SAVED_BADGES; }
function saveProfile() {
  const id = ST.code + '-' + ST.gameNo + '-' + ST.me.id, done = st.get('msc_saved', []);
  if (done.includes(id)) return;
  const R = ST.result, me = ME();
  const pr = Object.assign({ games: 0, wins: 0, pts: 0, votes: 0, hits: 0, roles: {}, hist: [], badges: [] }, st.get('msc_prof', {}));
  pr.games++; if (R.won) pr.wins++; pr.pts += R.pts; pr.votes += R.votes; pr.hits += R.hits;
  const rr = pr.roles[me.role] || { p: 0, w: 0 }; rr.p++; if (R.won) rr.w++; pr.roles[me.role] = rr;
  pr.hist.unshift({ d: new Date().toLocaleDateString('vi-VN'), role: me.role, won: R.won, pts: R.pts }); pr.hist = pr.hist.slice(0, 10);
  const nb = [], add = k => { if (!pr.badges.includes(k)) { pr.badges.push(k); nb.push(k); } };
  add('first'); if (R.won && me.role === 'wolf' && R.alive) add('oscar'); if (R.seerFound) add('detective'); if (R.won && R.alive) add('survivor');
  if (R.hits >= 2) add('sharp'); if (pr.games >= 5) add('regular'); if (R.cupid) add('cupid'); if (R.shotWolf) add('sniper'); if (R.saved) add('potion'); if (R.betOk) add('oracle');
  st.set('msc_prof', pr); done.push(id); st.set('msc_saved', done.slice(-50)); SAVED_BADGES = nb;
  vib([80, 50, 80, 50, 120]); SCREENS.end.full();
}
function iconOf(d) { if (!d) return ''; if (d.t === 'art') return art(d.k); if (d.t === 'team') return teamMark(d.k); if (d.t === 'av') { const p = P(d.id); return p ? mini(p) : ''; } if (d.t === 'ic') return ic(d.k); return ''; }
function replay() {
  VIEW = 'replay'; setMode('night'); const groups = [];
  (ST.log || []).forEach(e => { const k = e.r + '_' + e.ph; let g = groups[groups.length - 1]; if (!g || g.k !== k) { g = { k, r: e.r, ph: e.ph, items: [] }; groups.push(g); } g.items.push(e); });
  view(`<div class="hdr"><span class="pill">${ic('replay')} Xem lại ván đấu</span><span class="pill">${groups.length} chặng</span></div>
  <p class="mut">Toàn bộ diễn biến, kể cả những gì xảy ra trong bóng tối.</p>
  <div class="tl">${groups.map(g => `<div class="tlg"><div class="tlh"><span class="tli">${art(g.ph === 'night' ? 'moon' : 'sun')}</span>${g.ph === 'night' ? 'Đêm' : 'Ngày'} ${g.r}</div>${g.items.map(e => `<div class="tle"><span class="tlic">${iconOf(e.i)}</span><div>${e.t}</div></div>`).join('')}</div>`).join('')}</div>
  <button class="btn" onclick="VIEW='game';KEY='';render()">Quay lại kết quả</button>`);
}

/* ----- profile ----- */
function profile() {
  VIEW = 'profile'; setMode('night'); saveName();
  const pr = Object.assign({ games: 0, wins: 0, pts: 0, votes: 0, hits: 0, roles: {}, hist: [], badges: [] }, st.get('msc_prof', {}));
  const rate = pr.games ? Math.round(100 * pr.wins / pr.games) : 0, acc = pr.votes ? Math.round(100 * pr.hits / pr.votes) : 0;
  const rank = RANKS.filter(r => pr.pts >= r[0]).pop()[1], nxt = RANKS.find(r => r[0] > pr.pts);
  const meP = { id: 0, name: CFG.name || 'Bạn', color: COLORS[0] };
  view(`<div class="hdr"><span class="pill">${ic('user')} Hồ sơ</span><span class="pill">${ic('star')} ${pr.pts} điểm</span></div>
  <div class="card"><div class="ph"><div class="ring">${avatar(meP)}</div><div><div class="big2">${esc(meP.name)}</div><p class="mut">Cấp bậc: <b style="color:var(--acc)">${rank}</b></p>${nxt ? `<p class="mut sm">Còn ${nxt[0] - pr.pts} điểm để lên ${nxt[1]}</p>` : ''}</div></div></div>
  <div class="stats"><div class="card"><b>${pr.games}</b><span>Ván đã chơi</span></div><div class="card"><b>${rate}%</b><span>Tỷ lệ thắng</span></div><div class="card"><b>${acc}%</b><span>Vote trúng Sói</span></div></div>
  <div class="card"><b>Thành tích theo vai</b>${Object.keys(ROLES).map(k => { const r = pr.roles[k] || { p: 0, w: 0 }, pc = r.p ? Math.round(100 * r.w / r.p) : 0; return `<div class="rb"><span>${art(k)} ${ROLES[k].n}</span><div class="rbar"><i style="width:${pc}%;background:${ROLES[k].c}"></i></div><span class="mut">${r.w}/${r.p}</span></div>`; }).join('')}</div>
  <div class="card"><b>Huy hiệu</b><div class="badges">${Object.keys(BADGES).map(k => `<div class="bd ${pr.badges.includes(k) ? '' : 'off'}"><span class="md" style="background:${BADGES[k].c}">${ic(BADGES[k].i)}</span><small>${BADGES[k].n}</small></div>`).join('')}</div></div>
  <div class="card"><b>Lịch sử gần đây</b>${pr.hist.length ? pr.hist.map(h => `<div class="lbr"><span class="mut">${h.d}</span><span>${ROLES[h.role].n}</span><b class="${h.won ? 'gw' : 'gl'}">${h.won ? 'Thắng' : 'Thua'} +${h.pts}</b></div>`).join('') : '<p class="mut" style="margin-top:8px">Chưa có ván nào.</p>'}</div>
  <p class="note">Hồ sơ được lưu trên chính điện thoại này.</p>
  <button class="btn" onclick="${ST ? "VIEW='game';KEY='';render()" : 'home()'}">${ST ? 'Quay lại phòng' : 'Về trang chủ'}</button>`);
}

/* ----- phiên bản ----- */
// Phiên bản đang chạy trên trang này được nhúng sẵn lúc build; máy chủ báo phiên bản của nó khi kết nối.
const CLIENT_VERSION = '__CLIENT_VERSION__';
$('ver').textContent = `Phiên bản ${CLIENT_VERSION} · cập nhật __CLIENT_UPDATED__`;
let UPDATING = false;
function checkVersion(v) {
  if (!v || !v.version || v.version === CLIENT_VERSION || UPDATING) return;
  UPDATING = true;
  const b = document.createElement('div'); b.className = 'upd'; b.innerHTML = `${ic('replay')} Đã có phiên bản ${v.version} · đang tải lại…`; document.body.appendChild(b);
  setTimeout(() => { location.reload(); }, 1500);
}
socket.on('version', checkVersion);
setInterval(() => { fetch('/version.json', { cache: 'no-store' }).then(r => r.json()).then(checkVersion).catch(() => {}); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) fetch('/version.json', { cache: 'no-store' }).then(r => r.json()).then(checkVersion).catch(() => {}); });

/* ----- khởi động ----- */
if (!st.get('msc_room', null)) home(); else view(`<div class="card center" style="margin-top:40vh"><p class="mut">Đang kết nối lại phòng…</p></div>`);
setTimeout(() => { if (!ST && VIEW !== 'profile') home(); }, 4000);

</script>
</body>
</html>
